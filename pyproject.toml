[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "anchor-op"
version = "0.1.0"
description = "Measure identifiable local dynamical actions from Perturb-seq response data."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [
  {name = "Manus AI"}
]
keywords = ["single-cell", "Perturb-seq", "CRISPR", "Jacobian", "system-identification"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Topic :: Scientific/Engineering :: Bio-Informatics",
]
dependencies = [
  "numpy>=1.24",
  "pandas>=2.0",
]

[project.optional-dependencies]
nmf = ["scikit-learn>=1.3"]
anndata = ["anndata>=0.10"]
test = ["pytest>=8.0"]
docs = ["jupyter>=1.0", "matplotlib>=3.7"]
all = ["scikit-learn>=1.3", "anndata>=0.10", "pytest>=8.0", "jupyter>=1.0", "matplotlib>=3.7"]

[project.urls]
Homepage = "https://github.com/manarai/anchor-op"
Repository = "https://github.com/manarai/anchor-op"
Issues = "https://github.com/manarai/anchor-op/issues"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = [
  "acceptance: load-bearing acceptance test",
]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
# Ruff's formatter is authoritative; E501 remains unsuitable for long scientific
# messages and structured type signatures that the formatter deliberately retains.
ignore = ["E501"]

[tool.coverage.run]
source = ["anchorop"]
branch = true

[tool.coverage.report]
show_missing = true
fail_under = 85
